<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dr. Arash – Tasks &amp; Calendar</title>
<style>
:root{--bg:#f7f7f4;--fg:#1d1d1b;--mut:#6b6b66;--card:#fff;--line:#e2e2dc;--exam:#c0392b;--deadline:#b7791f;--class:#2b6cb0;--duty:#6b6b66;--task:#2f855a}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--fg:#ecece8;--mut:#9a9a93;--card:#1f1f1d;--line:#34342f;--exam:#ff7a6b;--deadline:#e6b75c;--class:#6aa9ee;--duty:#9a9a93;--task:#6fcf97}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}h1{font-size:22px;margin:4px 0}h2{font-size:16px;margin:24px 0 8px}
.sub{color:var(--mut);font-size:13px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.dow{font-size:12px;color:var(--mut);text-align:center}
.day{min-height:92px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;font-size:12px;overflow:hidden}
.day.out{opacity:.35}.day.today{outline:2px solid var(--class)}.num{font-weight:600;color:var(--mut)}
.ev{display:block;margin-top:2px;padding:1px 4px;border-left:3px solid var(--c);border-radius:3px;background:color-mix(in srgb,var(--c) 12%,transparent);line-height:1.25}
.k-exam{--c:var(--exam)}.k-deadline{--c:var(--deadline)}.k-class{--c:var(--class)}.k-duty{--c:var(--duty)}.k-task{--c:var(--task)}
.tbc::after{content:" (TBC)";color:var(--mut)}
.list{background:var(--card);border:1px solid var(--line);border-radius:10px}.row{display:flex;gap:10px;padding:8px 12px;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.tag{font-size:11px;border:1px solid var(--line);border-radius:99px;padding:0 8px;color:var(--mut);white-space:nowrap;align-self:flex-start}
.p1{color:var(--exam);font-weight:600}.date{min-width:92px;color:var(--mut)}
@media(max-width:700px){.day{min-height:60px}.ev{font-size:10px}}
</style></head><body><main>
<h1>Tasks &amp; Calendar</h1><div class="sub" id="upd"></div>
<div class="bar"><button id="prev">◀</button><b id="mon"></b><button id="next">▶</button><button id="today">Today</button></div>
<div class="grid" id="cal"></div>
<h2>Coming up (dated)</h2><div class="list" id="up"></div>
<h2>No date yet</h2><div class="list" id="nodate"></div>
<h2>Done</h2><div class="list" id="done"></div>
</main><script>
const D={"updated": "2026-11-13", "events": [{"d": "2026-11-14", "t": "MAI 656 class 10:00 – tell students: upload projects; what the Final covers; issue Assignment 2", "c": "MAI656", "k": "class"}, {"d": "2026-11-16", "t": "Last day for WN grade", "c": "All", "k": "deadline"}, {"d": "2026-11-16", "t": "Labs 9 & 10 refined and sent to TAs (before Monday) – draft only", "c": "BCS311", "k": "task"}, {"d": "2026-11-23", "t": "Quiz 2 window (CLO3+4) – exact day: see 'Assessment Schedule' email (TBC)", "c": "BCS311", "k": "exam", "tbc": true}, {"d": "2026-11-23", "t": "BCS 311 Assignment (CLO5) issued – proposed", "c": "BCS311", "k": "task", "tbc": true}, {"d": "2026-12-03", "t": "MAI 656 Assignment 2 due 23:59 – proposed", "c": "MAI656", "k": "deadline", "tbc": true}, {"d": "2026-12-04", "t": "MAI 656 group project report due – proposed", "c": "MAI656", "k": "deadline", "tbc": true}, {"d": "2026-12-05", "t": "MAI 656 project presentations (last class) – proposed", "c": "MAI656", "k": "class", "tbc": true}, {"d": "2026-12-06", "t": "BCS 311 Assignment due 23:59 – proposed", "c": "BCS311", "k": "deadline", "tbc": true}, {"d": "2026-12-07", "t": "BCS 311 Lab Final window (7–9 Dec) – exact day: see email (TBC)", "c": "BCS311", "k": "exam", "tbc": true}, {"d": "2026-12-11", "t": "Last day of classes", "c": "All", "k": "deadline"}, {"d": "2026-12-12", "t": "Invigilation 09:30 LNG171 (chief, HUB-111); 12:30 INB450 + MKT208 (HUB Yard C)", "c": "Duty", "k": "duty"}, {"d": "2026-12-13", "t": "MAI 656 FINAL 15:30 – HUB Yard Zone A", "c": "MAI656", "k": "exam"}, {"d": "2026-12-13", "t": "Invigilation 09:30 CRI100, GED196 ×2 (Yard C)", "c": "Duty", "k": "duty"}, {"d": "2026-12-14", "t": "BCS 402 FINAL 12:30 – HUB-123", "c": "BCS402", "k": "exam"}, {"d": "2026-12-14", "t": "Invigilation 09:30 GED324, MTH105 ×2 (Yard A)", "c": "Duty", "k": "duty"}, {"d": "2026-12-17", "t": "Invigilation 15:30 BAI201 ×2, CMN448, EBU210 (chief, Yard D)", "c": "Duty", "k": "duty"}, {"d": "2026-12-19", "t": "BCS 311 FINAL 15:30 – HUB-111/114/112/101", "c": "BCS311", "k": "exam"}, {"d": "2026-12-19", "t": "Invigilation 09:30 BCS401 HUB-126", "c": "Duty", "k": "duty"}, {"d": "2026-12-20", "t": "Invigilation 15:30 SEN exam HUB-113", "c": "Duty", "k": "duty"}, {"d": "2026-12-21", "t": "Fall break begins (until 1 Jan)", "c": "All", "k": "deadline"}, {"d": "2027-01-11", "t": "Spring semester starts", "c": "All", "k": "deadline"}], "tasks": [{"t": "Read 'Assessment Schedule' email → fix Quiz 2 / Lab Final dates, then draft student announcements (Outlook has no account / web offline)", "p": "P1", "c": "BCS311"}, {"t": "Reconnect Claude-in-Chrome extension (disconnected) – needed for Moodle/portal work", "p": "P1", "c": "Secretary"}, {"t": "Master degree programs proposal – Dr. Firuz finished his part; find my part in his email", "p": "P1", "c": "Admin"}, {"t": "Review drafts: Quiz 2, Lab Final V1/V2, Finals (BCS 311, BCS 402, MAI 656) + keys", "p": "P1", "c": "All"}, {"t": "Moodle BCS 311 sec 3 (folder 6): swap appeal-affected midterm 'Low' sample – new file ready, upload blocked (Chrome extension disconnected after login change); check BCS 402 samples for appeal notes", "p": "P1", "c": "BCS311"}, {"t": "Final Exam Review Forms: send my part to reviewers (drafts ready)", "p": "P1", "c": "All"}, {"t": "Midterm Answer Script Review Forms: confirm BCS 402 date/script counts; chase reviewer signatures", "p": "P2", "c": "BCS402"}, {"t": "Moodle course files: folders 1–2 (syllabus, teaching material) for all shells; check BCS 311 lab shells", "p": "P2", "c": "All"}, {"t": "CUD portal: CLO data, exam definitions, grade Excel upload (needs portal session)", "p": "P2", "c": "All"}, {"t": "MAI 656 Assignment 1: grade (not graded yet)", "p": "P2", "c": "MAI656"}, {"t": "MAI 656 co-delivery requisition form – list what is missing", "p": "P2", "c": "MAI656"}, {"t": "BCS 402 assignment (ongoing) – grading when due", "p": "P2", "c": "BCS402"}, {"t": "Absentee report: midterm + quiz vs roster (BCS 311)", "p": "P2", "c": "BCS311"}, {"t": "AWS budget alerts: collect + explain the different limits", "p": "P2", "c": "Grading"}, {"t": "RTA / predictive-maintenance outreach: named contacts, drafts only", "p": "P2", "c": "Grants"}, {"t": "BCS 311 labs 6–11 final check (zip with .m/data, real answer keys)", "p": "P2", "c": "BCS311"}, {"t": "NLP transformers lecture: finish rewrites", "p": "P2", "c": "MAI656"}, {"t": "Industry-collaboration feedback forms (BCS 311 + BCS 402)", "p": "P2", "c": "Admin"}, {"t": "Find grade-submission and course-file deadlines in email", "p": "P2", "c": "All"}, {"t": "Phone push reminders: needs Remote Control; set up daily brief", "p": "P3", "c": "Secretary"}], "done": ["Moodle folders 3, 4, 6 (Quiz 1 + Midterm) – BCS 402 and BCS 311 sections 1–4", "Unsigned review form removed from BCS 402 Moodle folder", "Draft: BCS 311 CLO5 assignment, MAI 656 Assignment 2, Lab Final, Quiz 2, three Finals (+ keys)", "Draft: Answer Script and Final Exam Review Forms"]};const MON=["January","February","March","April","May","June","July","August","September","October","November","December"];
let y=2026,m=10;const today=new Date();const iso=(a,b,c)=>a+"-"+String(b+1).padStart(2,"0")+"-"+String(c).padStart(2,"0");
document.getElementById("upd").textContent="Updated "+D.updated+" · dates marked TBC are proposals";
function esc(s){return s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}
function cal(){document.getElementById("mon").textContent=MON[m]+" "+y;const g=document.getElementById("cal");g.innerHTML="";
 ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].forEach(x=>g.insertAdjacentHTML("beforeend",`<div class="dow">${x}</div>`));
 const first=new Date(y,m,1),off=(first.getDay()+6)%7,start=new Date(y,m,1-off);
 for(let i=0;i<42;i++){const t=new Date(start);t.setDate(start.getDate()+i);const k=iso(t.getFullYear(),t.getMonth(),t.getDate());
  const ev=D.events.filter(e=>e.d===k).map(e=>`<span class="ev k-${e.k} ${e.tbc?"tbc":""}" title="${esc(e.t)}">${esc(e.t)}</span>`).join("");
  const td=(t.toDateString()===today.toDateString())?" today":"";
  g.insertAdjacentHTML("beforeend",`<div class="day${t.getMonth()!==m?" out":""}${td}"><span class="num">${t.getDate()}</span>${ev}</div>`);if(i>=34&&t.getMonth()!==m&&t.getDay()===0)break;}}
document.getElementById("prev").onclick=()=>{m--;if(m<0){m=11;y--}cal()};document.getElementById("next").onclick=()=>{m++;if(m>11){m=0;y++}cal()};
document.getElementById("today").onclick=()=>{y=today.getFullYear();m=today.getMonth();cal()};cal();
const now=iso(today.getFullYear(),today.getMonth(),today.getDate());
document.getElementById("up").innerHTML=D.events.filter(e=>e.d>=now).sort((a,b)=>a.d.localeCompare(b.d)).map(e=>`<div class="row"><span class="date">${e.d}</span><span class="${e.tbc?"tbc":""}">${esc(e.t)}</span><span class="tag">${e.c}</span></div>`).join("")||'<div class="row">Nothing dated.</div>';
document.getElementById("nodate").innerHTML=D.tasks.map(t=>`<div class="row"><span class="${t.p==="P1"?"p1":""}" style="min-width:26px">${t.p}</span><span>${esc(t.t)}</span><span class="tag">${t.c}</span></div>`).join("");
document.getElementById("done").innerHTML=D.done.map(t=>`<div class="row">✓ ${esc(t)}</div>`).join("");
</script></body></html>
